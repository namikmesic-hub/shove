# Retry docker-backed integration tests once to handle occasional
# container startup races under load.

[experimental]
setup-scripts = true

[profile.default]
retries = 1

[scripts.setup.rabbitmq-setup]
command = 'tests/scripts/rmq_setup.sh'
slow-timeout = { period = "90s" }

[[profile.default.overrides]]
# `metrics_sqs_sequenced` asserts exact counter values and so cannot poll the
# metric for progress; it waits on wall-clock deadlines instead. Give it every
# test thread for its duration so it is never scheduled alongside the ~40 tests
# in `sns_sqs_integration`, each of which boots its own LocalStack container.
# Per-test exclusivity rather than a `[test-groups]` cap over all the LocalStack
# binaries: a shared group would have to serialize those 40 as well, lengthening
# the whole leg in order to protect one test.
filter = 'binary_id(shove::metrics_sqs_sequenced)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
# The two Kafka in-place order tests that change the group's membership while
# a head record waits in place: one stages a cooperative rebalance, the other
# a coordinator-forced revoke, and each polls the group through it. They run
# with every test thread rather than beside the other Kafka brokers a run at
# default parallelism starts, whose pressure stretches a rebalance past the
# bounds a laptop holds. Per-test exclusivity rather than a group cap, as for
# `metrics_sqs_sequenced` above.
filter = 'test(=cooperative_rebalance_does_not_commit_past_deferred_head) | test(=a_forced_revoke_ends_the_in_place_wait_and_the_new_owner_completes_the_record)'
threads-required = 'num-test-threads'

[[profile.default.scripts]]
# The `metrics_rabbitmq_*` binaries share the container rather than starting
# their own: each carves out a private vhost per run, so they cannot collide
# with the main suite's queues or with each other.
filter = 'binary_id(shove::rabbitmq_integration) + binary_id(shove::rabbitmq_broadcast_integration) + binary_id(shove::rabbitmq_batch_integration) + binary_id(shove::metrics_rabbitmq_sequenced) + binary_id(shove::metrics_rabbitmq_sequence_timeout) + binary_id(shove::metrics_rabbitmq_batch)'
setup = ['rabbitmq-setup']
